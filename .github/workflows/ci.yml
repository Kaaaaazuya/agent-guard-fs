name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # go.mod の `toolchain go1.27.2` により、これがないと Go 1.26 のジョブが
  # 黙ってそのツールチェーンに切り替わり、1.26 を検証できない。
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # 依存は Takumi Guard 経由で取得する（`direct` へのフォールバックなし）。
      - uses: flatt-security/setup-takumi-guard-golang@v1
      - run: go mod download
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task fmt-check
      - run: task vet
      - run: task test
      - run: task build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: flatt-security/setup-takumi-guard-golang@v1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: flatt-security/setup-takumi-guard-golang@v1
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task vuln
